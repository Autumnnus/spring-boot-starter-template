# Validation Messages - English

# Standard Bean Validation Messages
jakarta.validation.constraints.AssertFalse.message=must be false
jakarta.validation.constraints.AssertTrue.message=must be true
jakarta.validation.constraints.DecimalMax.message=must be less than or equal to {value}
jakarta.validation.constraints.DecimalMin.message=must be greater than or equal to {value}
jakarta.validation.constraints.Digits.message=numeric value out of bounds (<{integer} digits>.<{fraction} digits> expected)
jakarta.validation.constraints.Email.message=must be a valid email address
jakarta.validation.constraints.Future.message=must be a future date
jakarta.validation.constraints.FutureOrPresent.message=must be a date in the present or future
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Negative.message=must be negative
jakarta.validation.constraints.NegativeOrZero.message=must be negative or zero
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.Null.message=must be null
jakarta.validation.constraints.Past.message=must be a past date
jakarta.validation.constraints.PastOrPresent.message=must be a date in the past or present
jakarta.validation.constraints.Pattern.message=must match the pattern {regexp}
jakarta.validation.constraints.Positive.message=must be positive
jakarta.validation.constraints.PositiveOrZero.message=must be positive or zero
jakarta.validation.constraints.Size.message=size must be between {min} and {max}

# Custom Validation Messages
user.email.required=Email is required
user.email.invalid=Please enter a valid email address
user.password.required=Password is required
user.password.min_length=Password must be at least 8 characters long
user.password.max_length=Password must not exceed 128 characters
user.firstName.required=First name is required
user.firstName.size=First name must be between 1 and 50 characters
user.lastName.required=Last name is required
user.lastName.size=Last name must be between 1 and 50 characters

role.name.required=Role name is required
role.name.size=Role name must be between 2 and 50 characters
role.description.size=Description must not exceed 255 characters

permission.name.required=Permission name is required
permission.name.size=Permission name must be between 2 and 100 characters
permission.resource.required=Resource is required
permission.action.required=Action is required

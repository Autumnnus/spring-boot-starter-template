spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active:
      - dev
  datasource:
    url: ${POSTGRES_URI}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  docker:
    compose:
      lifecycle-management: START_AND_STOP
      stop:
        command: down
        arguments: --volumes --remove-orphans
      skip:
        in-tests: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        ddl-auto: create-drop
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  elasticsearch:
    uris: ${ELASTICSEARCH_HOSTS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTIC_PASSWORD}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

logging:
  pattern:
    level: "%5p [trace=%X{traceId}]"
  audit:
    enabled: true
    async: true
    retention-days: 365
  application:
    enabled: true
    async: true
    elasticsearch:
      index-pattern: "application-logs-{yyyy.MM}"
      retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info

application:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: P1D #PT15M
    refresh-token-ttl: P7D
    email-verification-token-ttl: PT24H
    password-reset-token-ttl: PT1H
    public-endpoints:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api/v1/auth/**
      - /login/oauth2/**
      - /oauth2/**
      - /oauth-test.html
      - /css/**
      - /js/**
      - /images/**
    oauth2:
      success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:8088/oauth-test.html}
      failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:8088/oauth-test.html}
  email:
    from: ${EMAIL_FROM:noreply@example.com}
    from-name: ${EMAIL_FROM_NAME:Spring Boot Starter}
    base-url: ${APP_BASE_URL:http://localhost:8088}
  rate-limit:
    capacity: 100
    refill-period: PT1M
  messaging:
    notifications:
      exchange: notifications.exchange
      queue: notifications.queue
      routing-key: notifications.key
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
      endpoint: ${AWS_S3_ENDPOINT}
      path-style-access: false
      public-base-url: ${AWS_S3_PUBLIC_URL}
